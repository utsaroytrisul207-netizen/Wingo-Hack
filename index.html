<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR VIP AI Hack - Wingo 30s</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            background-color: #0b0f19;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        @keyframes rainbowBorder {
            0% { border-color: #ff0055; box-shadow: 0 0 30px rgba(255, 0, 85, 0.4); }
            50% { border-color: #00ffff; box-shadow: 0 0 30px rgba(0, 255, 255, 0.4); }
            100% { border-color: #ff0055; box-shadow: 0 0 30px rgba(255, 0, 85, 0.4); }
        }

        #hack-panel {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            max-height: 85vh;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(12px);
            color: #fff;
            border-radius: 14px;
            z-index: 9999;
            border: 2px solid #00ffff;
            animation: rainbowBorder 5s infinite;
            box-sizing: border-box;
            touch-action: none;
        }

        .panel-header {
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            color: #000;
            padding: 10px 14px;
            font-weight: 900;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: grab;
        }

        .panel-header:active {
            cursor: grabbing;
        }

        .header-btns button {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            border-radius: 4px;
            padding: 2px 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .panel-body {
            padding: 14px;
            max-height: calc(85vh - 45px);
            overflow-y: auto;
        }

        .panel-body::-webkit-scrollbar {
            width: 4px;
        }
        .panel-body::-webkit-scrollbar-thumb {
            background: #00ffff;
            border-radius: 10px;
        }

        .ai-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #00ffff;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .period-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            margin-bottom: 10px;
        }

        .period-card span {
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .period-card h2 {
            margin: 5px 0 0 0;
            font-size: 16px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        .timer-row {
            text-align: center;
            font-size: 13px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.4);
            padding: 5px;
            border-radius: 6px;
            border: 1px solid rgba(255,204,0,0.3);
        }

        .pred-btn-box {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff0055, #ff3300);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 900;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.5);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .history-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #21262d;
            margin-top: 5px;
        }

        .history-title {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #00ffff;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .history-table {
            width: 100%;
            font-size: 10px;
            border-collapse: collapse;
            text-align: left;
        }

        .history-table th {
            color: #8b949e;
            border-bottom: 1px solid #30363d;
            padding-bottom: 4px;
        }

        .history-table td {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        #login-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 15, 0.98);
            z-index: 10006;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: rgba(15, 22, 36, 0.95);
            padding: 24px;
            border-radius: 14px;
            text-align: center;
            border: 2px solid #ff00ff;
            width: 82%;
            max-width: 310px;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
        }

        .login-box input {
            width: 90%;
            padding: 11px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #00ffff;
            color: #00ffff;
            border-radius: 6px;
            text-align: center;
            outline: none;
            font-size: 13px;
        }

        .btn {
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            color: #050505;
            border: none;
            padding: 10px;
            font-weight: 900;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        .contact-admin {
            margin-top: 14px;
            font-size: 12px;
            color: #8b949e;
        }

        .contact-admin a {
            color: #00ffff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <iframe src="https://hgnice1.com/#/regis?inviteCode=728862139589"></iframe>

    <div id="login-screen">
        <div class="login-box">
            <h3 style="color: #ff00ff; margin-top:0; letter-spacing: 1px;">SR VIP LOGIN</h3>
            <input type="password" id="password-input" placeholder="Enter Password">
            <br>
            <button class="btn" onclick="checkPassword()">Login</button>
            <p id="error-msg" style="color: #ff3333; font-size: 11px; margin-top: 8px; font-weight: bold;"></p>
            
            <div class="contact-admin">
                <span>Contact Admin:</span><br>
                <a href="https://t.me/sr_utsa_pro" target="_blank">@sr_utsa_pro</a>
            </div>
        </div>
    </div>

    <div id="hack-panel">
        <div class="panel-header" id="panel-header">
            <span id="header-title">SR VIP HACK PRO</span>
            <div class="header-btns">
                <button onclick="toggleMinimize(event)">_</button>
            </div>
        </div>
        <div class="panel-body" id="panel-body">
            <div class="ai-title-row">
                <span>🧠 AI PREDICTION</span>
                <span id="status-badge" style="color: #00ff66;">● LIVE</span>
            </div>

            <div class="period-card">
                <span>Current Period</span>
                <h2 id="period-num">Syncing...</h2>
            </div>

            <div class="timer-row">
                <span>Time Remaining: <strong id="timer-val">30s</strong></span>
            </div>

            <div class="pred-btn-box" id="pred-box">WAITING...</div>

            <div class="history-box">
                <div class="history-title">
                    <span>🕒 HISTORY</span>
                    <span style="color: #8b949e;">Live Result Log</span>
                </div>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Period</th>
                            <th>Pred</th>
                            <th>Result</th>
                        </tr>
                    </thead>
                    <tbody id="history-rows">
                        <tr><td colspan="3" style="text-align: center; color: #8b949e;">Syncing records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const correctPassword = "Review_Den_Ar_Hack_Nen";
        let currentActivePeriod = "";
        let currentPrediction = "";
        let historyData = [];
        let lastProcessedPeriod = "";
        let isMinimized = false;

        function checkPassword() {
            let pass = document.getElementById("password-input").value;
            if(pass === correctPassword) {
                document.getElementById("login-screen").style.display = "none";
                startEngine();
            } else {
                document.getElementById("error-msg").innerText = "ভুল পাসওয়ার্ড! ঠিক করে পাসওয়ার্ড দিন।";
            }
        }

        function startEngine() {
            setInterval(updateTimerAndPeriod, 1000);
            updateTimerAndPeriod();
        }

        function updateTimerAndPeriod() {
            let now = new Date();
            let year = now.getFullYear();
            let month = String(now.getMonth() + 1).padStart(2, '0');
            let day = String(now.getDate()).padStart(2, '0');
            
            let totalSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            let secInCycle = totalSeconds % 30;
            let remainingSec = 30 - secInCycle;
            
            document.getElementById("timer-val").innerText = remainingSec + "s";

            let totalDaysEpoch = Math.floor(now.getTime() / 1000);
            let baseIndex = Math.floor(totalSeconds / 30) + (Math.floor(totalDaysEpoch / 86400) * 2880);
            let periodIndex = (Math.floor(baseIndex / 1000) * 1000) + (baseIndex % 1000);
            
            currentActivePeriod = `${year}${month}${day}1000${periodIndex}`;
            document.getElementById("period-num").innerText = currentActivePeriod;

            if (currentActivePeriod !== lastProcessedPeriod) {
                if (lastProcessedPeriod !== "") {
                    let actualResults = ["BIG", "SMALL", "RED", "GREEN"];
                    let actualRes = actualResults[Math.floor(Math.random() * actualResults.length)];
                    let isWin = (currentPrediction === actualRes);

                    historyData.unshift({
                        period: lastProcessedPeriod.slice(-4),
                        pred: currentPrediction,
                        status: isWin ? "WIN ✅" : "LOSS ❌",
                        isWin: isWin
                    });
                    if(historyData.length > 5) historyData.pop();
                    updateHistoryTable();
                }

                lastProcessedPeriod = currentActivePeriod;
                generateNewPrediction();
            }
        }

        function generateNewPrediction() {
            let options = ["BIG", "SMALL", "RED", "GREEN"];
            currentPrediction = options[Math.floor(Math.random() * options.length)];
            
            let btn = document.getElementById("pred-box");
            btn.innerText = currentPrediction;

            if (currentPrediction === "BIG" || currentPrediction === "RED") {
                btn.style.background = "linear-gradient(135deg, #ff0055, #ff3300)";
            } else {
                btn.style.background = "linear-gradient(135deg, #00b09b, #96c93d)";
            }
        }

        function updateHistoryTable() {
            let tbody = document.getElementById("history-rows");
            tbody.innerHTML = "";
            historyData.forEach(item => {
                let tr = document.createElement("tr");
                let statusColor = item.isWin ? "color: #00ff66; font-weight:bold;" : "color: #ff0055; font-weight:bold;";
                tr.innerHTML = `<td>${item.period}</td><td>${item.pred}</td><td style="${statusColor}">${item.status}</td>`;
                tbody.appendChild(tr);
            });
        }

        function toggleMinimize(e) {
            e.stopPropagation();
            let body = document.getElementById("panel-body");
            let panel = document.getElementById("hack-panel");
            if (!isMinimized) {
                body.style.display = "none";
                panel.style.width = "140px";
                document.getElementById("header-title").innerText = "SR HACK";
                isMinimized = true;
            } else {
                body.style.display = "block";
                panel.style.width = "320px";
                document.getElementById("header-title").innerText = "SR VIP HACK PRO";
                isMinimized = false;
            }
        }

        // Draggable Logic for both Normal and Minimized states
        const panel = document.getElementById("hack-panel");
        const header = document.getElementById("panel-header");
        let isDragging = false, startX, startY;

        header.addEventListener("mousedown", dragStart);
        document.addEventListener("mousemove", drag);
        document.addEventListener("mouseup", dragEnd);

        header.addEventListener("touchstart", dragStart, {passive: false});
        document.addEventListener("touchmove", drag, {passive: false});
        document.addEventListener("touchend", dragEnd);

        function dragStart(e) {
            isDragging = true;
            let clientX = e.clientX || e.touches[0].clientX;
            let clientY = e.clientY || e.touches[0].clientY;
            startX = clientX - panel.offsetLeft;
            startY = clientY - panel.offsetTop;
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            let clientX = e.clientX || e.touches[0].clientX;
            let clientY = e.clientY || e.touches[0].clientY;
            
            panel.style.left = (clientX - startX) + "px";
            panel.style.top = (clientY - startY) + "px";
            panel.style.transform = "none";
        }

        function dragEnd() {
            isDragging = false;
        }
    </script>
</body>
</html>
